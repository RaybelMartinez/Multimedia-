<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica de Inglés</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    button { padding: 12px 18px; margin: 8px; border: 0; border-radius: 7px; cursor: pointer; }
    #resultado { margin-top: 20px; padding: 15px; background: #eee; border-radius: 7px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Práctica de Inglés</h1>
    <p>Presiona el botón y practica tu pronunciación.</p>
    <button onclick="escuchar()">🎤 Hablar</button>
    <button onclick="detener()">⏹ Detener</button>
    <div id="resultado">Esperando...</div>
  </div>
  <script>
    const reconocimiento = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    reconocimiento.lang = 'en-US';
    reconocimiento.interimResults = false;
    const resultado = document.getElementById('resultado');

    function escuchar() {
      resultado.textContent = 'Escuchando...';
      reconocimiento.start();
    }

    function detener() {
      reconocimiento.stop();
      window.speechSynthesis.cancel();
      resultado.textContent = 'Detenido';
    }

    reconocimiento.onresult = function(event) {
      const texto = event.results[0][0].transcript;
      resultado.textContent = 'Dijiste: ' + texto;
      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = 'en-US';
      window.speechSynthesis.speak(voz);
    };

    reconocimiento.onerror = function(event) {
      resultado.textContent = 'Error: ' + event.error;
    };
  </script>
</body>
</html>
